[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simplibs-regex"
version = "0.3.0"
description = "Lightweight, immutable regular expression helper library with lazy compilation and composable pattern utilities for the simplibs ecosystem."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "regex",
    "regexp",
    "pattern",
    "pattern-matching",
    "lazy-compilation",
    "simplibs",
    "simplibs-regex",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "simplibs-exception>=1.0.0",
    "simplibs-validate>=0.2.0"
]

[[project.authors]]
name = "Dalibor Sova (Sudip2708)"
email = "daliborsova@seznam.cz"

[project.urls]
Homepage = "https://github.com/simplibs/simplibs-regex"
Repository = "https://github.com/simplibs/simplibs-regex"
Issues = "https://github.com/simplibs/simplibs-regex/issues"
Changelog = "https://github.com/simplibs/simplibs-regex/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["src"]